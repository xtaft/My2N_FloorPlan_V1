name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab without pushing.
  workflow_dispatch:

# Grants the workflow the rights the Pages deploy action needs. `id-token` is
# required: the deploy step authenticates to Pages with a short-lived OIDC
# token rather than a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer build supersede the older one, but
# don't cancel a deploy that's already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (not `npm install`) — installs exactly what
      # package-lock.json pins, so the deployed build matches what you tested
      # locally instead of silently picking up newer minor versions.
      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
